            { id: "scope", index: "01", title: "Scope", paragraphs: ["This policy explains how ClickFix Mitigator processes data when a person visits the public website, requests analyst access, uses the browser protection layer or accesses the authenticated investigation platform.", "If a specific component requires additional contractual or product terms, those additional terms apply together with this policy unless they explicitly replace a section of it."] },

          sections: [
            { id: "scope", index: "01", title: "Abast", paragraphs: ["Aquesta política explica com ClickFix Mitigator tracta dades quan una persona visita el web públic, sol·licita accés d'analista, utilitza la capa de protecció del navegador o accedeix a la plataforma autenticada d'investigació.", "Si un component concret requereix termes addicionals, aquests termes s'aplicaran juntament amb aquesta política tret que substitueixin expressament una secció concreta."] },
            { id: "data-collected", index: "02", title: "Dades tractades", paragraphs: ["La plataforma està dissenyada per tractar només les dades necessàries per protegir els usuaris, operar el servei de manera segura i investigar activitat sospitosa."], items: ["Esdeveniments de seguretat com hostnames, URL reportades com a incident, marques temporals, deteccions activades, senyals de score i context d'investigació.", "Evidències vinculades a alertes, incloses captures aprovades, notes d'analistes, veredictes i metadades del flux de revisió.", "Telemetria operativa com la versió de l'extensió, l'identificador de client seudònim, metadades de sessió, logs d'autenticació i mètriques de qualitat del servei.", "Dades de configuració com allowlists, blocklists, preferències d'analista i ajustos de política de plataforma.", "Dades de sol·licituds d'accés com el correu professional, l'idioma de la sol·licitud, la IP d'origen, el user agent i la data d'enviament quan un visitant demana accés d'analista."], note: "ClickFix Mitigator no està dissenyat per recopilar contingut de navegació no relacionat, missatges personals ni identitat real per a la funció de baseline." },
            { id: "baseline", index: "03", title: "Baseline privat i reducció de falsos positius", paragraphs: ["L'extensió pot mantenir un baseline privat per instal·lació per reduir falsos positius en hostnames visitats amb freqüència. Aquest baseline s'associa a un identificador de client seudònim i no està pensat per identificar una persona real.", "Per a aquesta funció, l'extensió desa localment activitat a nivell de hostname, com el nombre de visites, dies vistos, alertes i resultats de revisió. El baseline s'utilitza per reduir soroll en deteccions febles o ambigües, però no anul·la senyals fortes d'execució maliciosa.", "Si l'usuari manté activat l'intercanvi del baseline, l'extensió pot enviar al servidor únicament un resum agregat per hostname per millorar globalment el tractament dels falsos positius. Aquest resum es limita a comptadors i indicadors de confiança, no a l'historial complet de navegació."], items: ["L'aprenentatge del baseline és local en primer lloc.", "Els resums enviats estan agregats i minimitzats.", "La ruta completa, la query string i el contingut de la pàgina no són necessaris per perfilar el baseline.", "L'usuari pot desactivar el baseline des de les opcions de l'extensió."] },
            { id: "purposes", index: "04", title: "Finalitat del tractament", items: ["Detectar i bloquejar fluxos sospitosos tipus ClickFix i patrons relacionats de lliurament de comandes.", "Operar el triatge d'alertes, l'enriquiment, la revisió d'evidències i els fluxos d'investigació per a analistes.", "Reduir falsos positius amb senyals de baseline locals o agregats.", "Gestionar comptes d'analista, permisos, auditoria i integritat del servei.", "Publicar estadístiques agregades de seguretat sense exposar detalls interns innecessaris."] },
            { id: "legal-basis", index: "05", title: "Base legal", paragraphs: ["El tractament es basa en l'interès legítim de protegir usuaris, entorns gestionats, analistes i el mateix servei davant d'activitat maliciosa o abusiva.", "Quan un usuari es registra, sol·licita accés, habilita funcions opcionals o envia informació manualment, aquesta acció forma part de la base que legitima el tractament associat."] },
            { id: "sharing", index: "06", title: "Compartició i divulgació", paragraphs: ["Les dades poden ser tractades pel backend de ClickFix Mitigator i per la infraestructura de suport necessària per operar alertes, evidències, investigacions i seguretat de la plataforma.", "Les dades no es venen ni es comparteixen amb tercers per a revenda publicitària. Només pot existir una divulgació limitada quan sigui necessària per prestar el servei, complir una obligació legal o donar suport a un flux de seguretat iniciat per un usuari autoritzat."] },
            { id: "not-collected", index: "07", title: "Què no es recopila per a la protecció baseline", items: ["La funció de baseline no requereix la identitat real de l'usuari de l'extensió.", "La funció de baseline no requereix pujar l'historial complet de navegació.", "La funció de baseline no requereix títols de pàgina, missatges personals ni contingut no relacionat.", "Els perfils publicitaris i els rastrejadors de màrqueting de tercers no formen part d'aquesta funció."] },
            { id: "controls", index: "08", title: "Control de l'usuari i conservació", paragraphs: ["L'usuari pot desactivar el baseline privat des de les opcions de l'extensió. Quan està desactivat, l'extensió deixa d'aprendre hosts habituals per a aquesta funció i deixa d'enviar resums de baseline.", "Els terminis de conservació varien segons el tipus d'alerta, l'estat de la investigació, la rellevància operativa i les obligacions legals. Els registres de baseline es conserven només mentre continuïn sent útils per a fluxos legítims de seguretat."] },
            { id: "security", index: "09", title: "Mesures de seguretat", paragraphs: ["S'apliquen mesures tècniques i organitzatives raonables per protegir les dades emmagatzemades i transmeses davant d'accessos no autoritzats, pèrdua, divulgació o alteració.", "Aquests controls poden incloure accés per rols, fluxos de revisió, registres d'auditoria, enduriment de sessions, validació de càrregues i restriccions administratives quan correspongui."] },
            { id: "rights", index: "10", title: "Drets de l'usuari", paragraphs: ["Segons la jurisdicció aplicable, els usuaris poden sol·licitar accés, rectificació, supressió o limitació del tractament de dades personals que els afectin.", "Les sol·licituds es revisen cas per cas, especialment quan la seguretat, la prevenció del frau, la preservació d'evidències o les obligacions legals exigeixen una conservació limitada."] },
            { id: "changes", index: "11", title: "Canvis en la política", paragraphs: ["Aquesta política es pot actualitzar per reflectir canvis legals, tècnics o operatius del projecte. Els canvis rellevants es reflectiran en aquesta pàgina juntament amb una data revisada."] },
            { id: "contact", index: "12", title: "Contacte", paragraphs: ["Per a consultes sobre privadesa o tractament de dades, utilitza els canals oficials de ClickFix Mitigator publicats al web públic o al repositori del projecte."] }
          ]
        }
      };

      function getLang(){var urlLang=new URLSearchParams(window.location.search).get("lang");if(urlLang&&i18n[urlLang])return urlLang;try{var saved=window.localStorage.getItem("clickfix_legal_lang");if(saved&&i18n[saved])return saved}catch(error){}var browser=(navigator.language||"en").slice(0,2).toLowerCase();return i18n[browser]?browser:"en"}
      function render(lang){var t=i18n[lang]||i18n.en;document.documentElement.lang=lang;document.title=t.title+" | ClickFix Mitigator";setText("eyebrow",t.eyebrow);setText("title",t.title);setText("summary",t.summary);setText("updated-label",t.updatedLabel);setText("updated-date",t.updatedDate);setText("meta-one",t.metaOne);setText("meta-two",t.metaTwo);setText("hero-note",t.heroNote);setText("legal-menu-title",t.legalMenuTitle);setText("link-home",t.linkHome);setText("link-privacy",t.linkPrivacy);setText("link-terms",t.linkTerms);setText("link-about",t.linkAbout);setText("language-title",t.languageTitle);setText("language-label",t.languageLabel);setText("toc-title",t.tocTitle);setText("content-title",t.contentTitle);setText("footer-text",t.footerText);setText("footer-terms",t.linkTerms);setText("footer-about",t.linkAbout);var toc=byId("toc");var content=byId("content");toc.innerHTML="";content.innerHTML="";(t.sections||[]).forEach(function(section){var tocLink=document.createElement("a");tocLink.className="toc-link";tocLink.href="#"+section.id;tocLink.innerHTML="<strong>"+section.index+"</strong><span>"+section.title+"</span>";toc.appendChild(tocLink);var article=document.createElement("section");article.className="section";article.id=section.id;var head=document.createElement("div");head.className="section-head";head.innerHTML="<div class=\"section-index\">"+section.index+"</div><h3>"+section.title+"</h3>";var body=document.createElement("div");body.className="section-body";(section.paragraphs||[]).forEach(function(text){var p=document.createElement("p");p.textContent=text;body.appendChild(p)});if(Array.isArray(section.items)&&section.items.length){var ul=document.createElement("ul");section.items.forEach(function(text){var li=document.createElement("li");li.textContent=text;ul.appendChild(li)});body.appendChild(ul)}if(section.note){var note=document.createElement("div");note.className="note";note.textContent=section.note;body.appendChild(note)}article.appendChild(head);article.appendChild(body);content.appendChild(article)});if(langSelect.value!==lang)langSelect.value=lang;try{window.localStorage.setItem("clickfix_legal_lang",lang)}catch(error){}}
      langSelect.addEventListener("change",function(){render(langSelect.value)});render(getLang())
    })();
  </script>
