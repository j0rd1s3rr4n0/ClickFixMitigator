        { id: "controller", index: "02", title: "Responsable i context del servei", paragraphs: ["ClickFix Mitigator és un projecte defensiu de seguretat centrat a detectar fluxos d'enginyeria social associats a abús tipus ClickFix, reduir execucions accidentals de comandes i donar suport als fluxos d'investigació per a analistes.", "El servei s'opera a través de les propietats web oficials de ClickFix Mitigator i de l'espai autenticat d'analistes."] },
        { id: "data-collected", index: "03", title: "Dades recollides", paragraphs: ["La plataforma està dissenyada per tractar només les dades necessàries per protegir els usuaris, operar el servei de manera segura i investigar activitat sospitosa."], items: ["Esdeveniments de seguretat com URL, hostnames, marques temporals, deteccions activades i context relacionat amb la investigació.", "Evidències vinculades a alertes, incloses captures aprovades, notes d'analistes, veredictes i metadades del flux de revisió.", "Telemetria operativa utilitzada per a mètriques, recurrència, estadístiques públiques de seguretat i monitoratge de qualitat del servei.", "Dades de compte i accés com usuaris, rols, metadades de sessió, logs d'autenticació i sol·licituds d'accés enviades des del web.", "Dades de configuració com allowlists, blocklists, preferències d'analista i ajustos de política de plataforma."], note: "ClickFix Mitigator no està dissenyat per recopilar contingut de navegació no relacionat, missatges personals ni dades personals innecessàries." },
        { id: "access-requests", index: "04", title: "Sol·licituds d'accés i formularis de contacte", paragraphs: ["Quan un visitant envia una sol·licitud d'accés d'analista, el servei pot emmagatzemar el correu professional enviat, l'idioma de la sol·licitud, la IP d'origen, el user agent i la marca temporal de l'enviament.", "Aquestes dades s'utilitzen per revisar la sol·licitud, prevenir abús del flux d'accés, respondre a interessos legítims i mantenir una traçabilitat auditable de l'accés."] },
        { id: "purposes", index: "05", title: "Finalitat del tractament", items: ["Detectar i bloquejar fluxos sospitosos tipus ClickFix i patrons relacionats de lliurament de comandes.", "Operar el triatge d'alertes, l'enriquiment, la revisió d'evidències i els fluxos d'investigació per a analistes.", "Gestionar comptes d'analista, permisos, auditoria i integritat del servei.", "Publicar estadístiques agregades i senyals públics de seguretat sense exposar detalls interns innecessaris."] },
        { id: "legal-basis", index: "06", title: "Base legal", paragraphs: ["El tractament es basa en l'interès legítim de protegir usuaris, entorns gestionats, analistes i el mateix servei davant d'activitat maliciosa o abusiva.", "Quan un usuari es registra, sol·licita accés o envia informació manualment de forma explícita, aquesta acció forma part de la base que legitima el tractament associat."] },
        { id: "sharing", index: "07", title: "Compartició i divulgació", paragraphs: ["Les dades poden ser tractades pel backend de ClickFix Mitigator i per la infraestructura de suport necessària per operar alertes, evidències, investigacions i seguretat de la plataforma.", "Les dades no es venen ni es comparteixen amb tercers per a revenda publicitària. Només pot existir una divulgació limitada quan sigui necessària per prestar el servei, complir una obligació legal o donar suport a un flux de seguretat iniciat per un usuari autoritzat."] },
        { id: "retention", index: "08", title: "Conservació", paragraphs: ["Les dades es conserven només durant el temps necessari per a operacions de seguretat, integritat d'evidències, auditoria, prevenció d'abús i administració legítima del servei.", "Els terminis poden variar segons el tipus d'alerta, l'estat de la investigació, la rellevància operativa i les obligacions legals aplicables."] },
        { id: "security", index: "09", title: "Mesures de seguretat", paragraphs: ["S'apliquen mesures tècniques i organitzatives raonables per protegir les dades emmagatzemades i transmeses davant d'accessos no autoritzats, pèrdua, divulgació o alteració.", "Aquests controls poden incloure accés per rols, fluxos de revisió, registres d'auditoria, enduriment de sessions i restriccions administratives quan correspongui."] },
        { id: "rights", index: "10", title: "Drets de l'usuari", paragraphs: ["Segons la jurisdicció aplicable, els usuaris poden sol·licitar accés, rectificació, supressió o limitació del tractament de dades personals que els afectin.", "Les sol·licituds es revisen cas per cas, especialment quan la seguretat, la prevenció del frau, la preservació d'evidències o les obligacions legals exigeixen una conservació limitada."] },
        { id: "changes", index: "11", title: "Canvis en la política", paragraphs: ["Aquesta política es pot actualitzar per reflectir canvis legals, tècnics o operatius del projecte. Els canvis rellevants es reflectiran en aquesta pàgina juntament amb una data revisada."] },
        { id: "contact", index: "12", title: "Contacte", paragraphs: ["Per a consultes sobre privadesa, tractament de dades o sol·licituds d'accés, utilitza els canals oficials de contacte publicats al web públic de ClickFix Mitigator."] }
      ];

d(head);article.appendChild(body);content.appendChild(article)});if(langSelect.value!==lang)langSelect.value=lang;try{window.localStorage.setItem("clickfix_legal_lang",lang)}catch(error){}}
      langSelect.addEventListener("change",function(){render(langSelect.value)});render(getLang())
    })();
