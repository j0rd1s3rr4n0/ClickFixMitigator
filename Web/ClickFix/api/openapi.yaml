openapi: 3.1.0
info:
  title: ClickFix Mitigator API
  version: 2026-04-27
  description: >-
    Operational API for alerts, stats, reviews, list management, investigations,
    and extension messaging.
servers:
  - url: /api
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /docs.php:
    get:
      summary: API discovery document
      responses:
        '200':
          description: OK
  /alerts.php:
    get:
      summary: List alerts
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: since_id
          schema: { type: integer, minimum: 0 }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: review_status
          schema: { type: string }
        - in: query
          name: blocked
          schema: { type: string }
      responses:
        '200': { description: OK }
  /alert.php:
    get:
      summary: Get one alert
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /stats.php:
    get:
      summary: Operational metrics
      responses:
        '200': { description: OK }
  /review.php:
    post:
      summary: Apply review verdict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id, review_status]
              properties:
                report_id: { type: integer, minimum: 1 }
                review_status:
                  type: string
                  enum: [pending, accepted, rejected, allowlisted]
      responses:
        '200': { description: Updated }
  /lists.php:
    get:
      summary: Read allow/block/investigate lists
      responses:
        '200': { description: OK }
    post:
      summary: Apply list action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [list_type, operation, domain]
                  properties:
                    list_type: { type: string, enum: [allowlist, blocklist, investigatelist] }
                    operation: { type: string, enum: [add, remove] }
                    domain: { type: string }
                    reason: { type: string }
                - type: object
                  required: [list_type, operation, domains]
                  properties:
                    list_type: { type: string, enum: [allowlist, blocklist, investigatelist] }
                    operation: { type: string, enum: [add, remove] }
                    domains:
                      type: array
                      items: { type: string }
                    reason: { type: string }
      responses:
        '200': { description: Action applied }
  /investigations.php:
    get:
      summary: List investigations or fetch one by graph_id
      parameters:
        - in: query
          name: graph_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 120 }
      responses:
        '200': { description: OK }
    post:
      summary: Create or update an investigation graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                graph_id: { type: integer, minimum: 1 }
                title: { type: string }
                site_domain: { type: string }
                verdict: { type: string, enum: [malicious, suspicious, clean, unknown, investigating] }
                summary: { type: string }
                tags: { type: string }
                source_report_id: { type: integer, minimum: 1 }
                graph:
                  type: object
      responses:
        '200': { description: Saved }
  /message-dispatch.php:
    post:
      summary: Send an operational message to browser extensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, title, body]
              properties:
                scope: { type: string, enum: [all, client, clients] }
                client_id: { type: string }
                client_ids:
                  type: array
                  items: { type: string }
                title: { type: string }
                body: { type: string }
                severity: { type: string, enum: [info, warning, critical] }
                expires_days: { type: integer, minimum: 1, maximum: 30 }
                expires_at: { type: string, format: date-time }
      responses:
        '200': { description: Sent }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
